<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<title>Waterfall Garden</title>
<script data-goatcounter="https://georgestriderbuilds.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
<style>
  :root{--jade:#3dff9e;--jade-dim:#1d7a52;--ink:#eafff3;--mute:#8fb8a4;--panel:rgba(6,24,17,.82)}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
  html,body{height:100%;background:#020604;color:var(--ink);font-family:ui-rounded,'Segoe UI',system-ui,sans-serif;overflow:hidden}
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{padding:14px 18px 8px;text-align:center}
  header h1{font-size:19px;letter-spacing:4px;font-weight:800;color:var(--jade);text-shadow:0 0 18px rgba(61,255,158,.45)}
  header p{font-size:12px;color:var(--mute);letter-spacing:1.5px;margin-top:3px}
  #stage{position:relative;flex:1;min-height:0;margin:4px 10px;border-radius:16px;overflow:hidden;
    border:1px solid rgba(61,255,158,.25);box-shadow:0 0 0 1px rgba(0,0,0,.6),0 12px 40px rgba(0,0,0,.55),inset 0 0 60px rgba(0,0,0,.5)}
  #view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
  #note{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:12.5px;color:var(--ink);
    text-shadow:0 1px 8px #000;opacity:0;transition:opacity .5s;pointer-events:none;padding:0 16px}
  #note.on{opacity:.92}
  #controls{padding:10px 12px calc(10px + env(safe-area-inset-bottom));padding-bottom:max(34px, calc(10px + env(safe-area-inset-bottom)));
    display:flex;flex-direction:column;gap:8px}
  .row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center}
  .lbl{font-size:10px;letter-spacing:2px;color:var(--mute);width:52px;text-align:right;flex-shrink:0}
  button{font-family:inherit;font-size:12.5px;letter-spacing:.4px;color:var(--ink);background:rgba(61,255,158,.07);
    border:1px solid rgba(61,255,158,.28);border-radius:999px;padding:7px 13px;cursor:pointer;min-height:34px}
  button.on{background:rgba(61,255,158,.28);border-color:var(--jade);color:#eafff3;box-shadow:0 0 12px rgba(61,255,158,.35)}
  button:active{transform:scale(.96)}
  #saveBtn{border-color:rgba(255,210,122,.5);background:rgba(255,210,122,.10)}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>WATERFALL GARDEN</h1>
    <p>A LIVING SPECTRUM, BLOOMING</p>
  </header>
  <div id="stage">
    <canvas id="view"></canvas>
    <div id="note"></div>
  </div>
  <div id="controls">
    <div class="row"><span class="lbl">SOURCE</span>
      <button data-set="src" data-val="signal" class="on">Garden signal</button>
      <button data-set="src" data-val="mic">Microphone</button>
      <button data-set="sound" data-val="toggle">Sound: off</button>
    </div>
    <div class="row"><span class="lbl">MIRROR</span>
      <button data-set="mirror" data-val="0" class="on">Off</button>
      <button data-set="mirror" data-val="2">2-way</button>
      <button data-set="mirror" data-val="4">4-way</button>
      <button data-set="mirror" data-val="8">8-way</button>
    </div>
    <div class="row"><span class="lbl">PALETTE</span>
      <button data-set="pal" data-val="jade" class="on">Jade</button>
      <button data-set="pal" data-val="ember">Ember</button>
      <button data-set="pal" data-val="ultra">Ultraviolet</button>
      <button id="saveBtn">Save PNG</button>
    </div>
  </div>
</div>
<script>
(function(){
'use strict';
var view=document.getElementById('view'),vtx=view.getContext('2d');
var stage=document.getElementById('stage'),noteEl=document.getElementById('note');
var wf=document.createElement('canvas'),wfx=wf.getContext('2d');
var W=0,H=0,DPR=1,ROW=3;
var mirror=0,palette='jade',source='signal',soundOn=false;
var ripples=[];

/* ---------- palettes: 256-entry magnitude LUTs ---------- */
function makeLUT(stops){
  var lut=[];
  for(var i=0;i<256;i++){
    var t=i/255,a=stops[0],b=stops[stops.length-1];
    for(var k=0;k<stops.length-1;k++){if(t>=stops[k][0]&&t<=stops[k+1][0]){a=stops[k];b=stops[k+1];break;}}
    var u=(t-a[0])/Math.max(1e-6,(b[0]-a[0]));
    var r=Math.round(a[1][0]+(b[1][0]-a[1][0])*u),g=Math.round(a[1][1]+(b[1][1]-a[1][1])*u),bl=Math.round(a[1][2]+(b[1][2]-a[1][2])*u);
    lut.push('rgb('+r+','+g+','+bl+')');
  }
  return lut;
}
var LUTS={
  jade:makeLUT([[0,[2,6,4]],[0.25,[4,32,20]],[0.55,[10,110,66]],[0.8,[61,255,158]],[1,[232,255,242]]]),
  ember:makeLUT([[0,[8,2,2]],[0.3,[64,10,4]],[0.6,[178,52,8]],[0.82,[255,140,40]],[1,[255,236,190]]]),
  ultra:makeLUT([[0,[4,2,12]],[0.3,[38,8,84]],[0.6,[110,32,190]],[0.82,[226,64,255]],[1,[170,255,255]]])
};
var lut=LUTS.jade;

/* ---------- audio ---------- */
var AC=null,analyser=null,srcGain=null,seedGain=null,outGain=null,sigBus=null,micSrc=null,micStream=null,freqData=null;
function ensureAudio(){
  if(AC)return true;
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return false;}
  analyser=AC.createAnalyser();analyser.fftSize=2048;analyser.smoothingTimeConstant=0.82;
  freqData=new Uint8Array(analyser.frequencyBinCount);
  srcGain=AC.createGain();srcGain.gain.value=1;srcGain.connect(analyser);
  seedGain=AC.createGain();seedGain.gain.value=1;seedGain.connect(analyser);
  outGain=AC.createGain();outGain.gain.value=0;analyser.connect(outGain);outGain.connect(AC.destination);
  startSignal();
  return true;
}
function startSignal(){
  sigBus=AC.createGain();sigBus.gain.value=0.55;sigBus.connect(srcGain);
  var roots=[110,164.81,220];
  roots.forEach(function(f,i){
    var o=AC.createOscillator();o.type='sine';o.frequency.value=f;
    var og=AC.createGain();og.gain.value=0.17/(i+1);o.connect(og);og.connect(sigBus);
    var lfo=AC.createOscillator();lfo.frequency.value=0.05+0.04*i;
    var lg=AC.createGain();lg.gain.value=f*0.16;lfo.connect(lg);lg.connect(o.frequency);
    o.start();lfo.start();
  });
  var len=AC.sampleRate*2,nb=AC.createBuffer(1,len,AC.sampleRate),d=nb.getChannelData(0);
  for(var i=0;i<len;i++)d[i]=Math.random()*2-1;
  var ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;
  var bp=AC.createBiquadFilter();bp.type='bandpass';bp.frequency.value=620;bp.Q.value=6;
  var ng=AC.createGain();ng.gain.value=0.05;
  var blfo=AC.createOscillator();blfo.frequency.value=0.07;
  var blg=AC.createGain();blg.gain.value=380;blfo.connect(blg);blg.connect(bp.frequency);
  ns.connect(bp);bp.connect(ng);ng.connect(sigBus);ns.start();blfo.start();
}
function note(msg,hold){
  if(msg){noteEl.textContent=msg;noteEl.classList.add('on');}
  if(!hold)setTimeout(function(){noteEl.classList.remove('on');},3600);
}
function setSource(want){
  if(want===source)return;
  if(want==='mic'){
    if(!ensureAudio()){note('Audio is not available in this browser.');return;}
    if(AC.resume)AC.resume();
    if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){note('Mic unavailable here — showing the garden\u2019s own signal.');return;}
    navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}})
    .then(function(stream){
      micStream=stream;micSrc=AC.createMediaStreamSource(stream);micSrc.connect(analyser);
      if(sigBus)sigBus.gain.value=0;
      source='mic';syncButtons();note('Listening — sing, tap, make some sound.');
    })
    .catch(function(){
      source='signal';syncButtons();
      note('Mic unavailable — showing the garden\u2019s own signal.');
    });
  }else{
    if(micSrc){try{micSrc.disconnect();}catch(e){} micSrc=null;}
    if(micStream){micStream.getTracks().forEach(function(t){t.stop();});micStream=null;}
    if(sigBus)sigBus.gain.value=0.55;
    source='signal';syncButtons();note('');
  }
}
function seedTone(x,y){
  ripples.push({x:x,y:y,t0:performance.now()});
  if(!AC||AC.state!=='running')return;
  var t=x/Math.max(1,W);
  var f=90*Math.pow(2,t*4.7); // ~90 Hz to ~2.3 kHz across the width
  var t0=AC.currentTime;
  [[1,0.16],[2,0.06],[3,0.025]].forEach(function(h){
    var o=AC.createOscillator();o.type='sine';o.frequency.value=f*h[0];
    var g=AC.createGain();
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.linearRampToValueAtTime(h[1],t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0008,t0+2.8);
    o.connect(g);g.connect(seedGain);o.start(t0);o.stop(t0+3.0);
  });
}

/* ---------- sizing ---------- */
function resize(){
  var r=stage.getBoundingClientRect();
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=Math.max(200,Math.round(r.width));H=Math.max(200,Math.round(r.height));
  view.width=W;view.height=H;wf.width=W;wf.height=H;
  wfx.fillStyle='#020604';wfx.fillRect(0,0,W,H);
  ROW=Math.max(2,Math.round(DPR*1.6));
}
var rzT=null;
window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(resize,150);});

/* ---------- waterfall ---------- */
var lastRow=0;
function pushRow(now){
  // scroll down
  wfx.drawImage(wf,0,ROW);
  var have=analyser&&AC&&AC.state==='running';
  if(have)analyser.getByteFrequencyData(freqData);
  var sr=AC?AC.sampleRate:48000,binHz=sr/2/(freqData?freqData.length:1024);
  for(var x=0;x<W;x++){
    var v;
    if(have){
      var f=50*Math.pow(200,x/Math.max(1,W-1)); // 50 Hz .. 10 kHz, log scale
      var b=Math.max(0,Math.min(freqData.length-1,Math.round(f/binHz)));
      v=freqData[b]/255;
    }else{
      // gentle synthetic shimmer until audio wakes
      v=0.16+0.13*Math.sin(x*0.045+now*0.0009)+0.10*Math.sin(x*0.013-now*0.0006)+0.06*Math.sin(x*0.11+now*0.002);
      if(v<0)v=0;if(v>1)v=1;
    }
    wfx.fillStyle=lut[Math.floor(v*255)];
    wfx.fillRect(x,0,1,ROW);
  }
}

/* ---------- display: mirror modes ---------- */
function draw(now){
  vtx.fillStyle='#020604';vtx.fillRect(0,0,W,H);
  if(mirror===0){
    vtx.drawImage(wf,0,0);
  }else if(mirror===2){
    vtx.drawImage(wf,0,0,W/2,H,0,0,W/2,H);
    vtx.save();vtx.translate(W,0);vtx.scale(-1,1);
    vtx.drawImage(wf,0,0,W/2,H,0,0,W/2,H);vtx.restore();
  }else if(mirror===4){
    var hw=W/2,hh=H/2;
    vtx.drawImage(wf,0,0,hw,hh,0,0,hw,hh);
    vtx.save();vtx.translate(W,0);vtx.scale(-1,1);vtx.drawImage(wf,0,0,hw,hh,0,0,hw,hh);vtx.restore();
    vtx.save();vtx.translate(0,H);vtx.scale(1,-1);vtx.drawImage(wf,0,0,hw,hh,0,0,hw,hh);vtx.restore();
    vtx.save();vtx.translate(W,H);vtx.scale(-1,-1);vtx.drawImage(wf,0,0,hw,hh,0,0,hw,hh);vtx.restore();
  }else{ // 8-way kaleidoscope wedges around the centre
    var cx=W/2,cy=H/2,R=Math.hypot(cx,cy),half=Math.PI/8;
    for(var k=0;k<8;k++){
      vtx.save();
      vtx.translate(cx,cy);vtx.rotate(k*Math.PI/4);
      if(k%2===1)vtx.scale(1,-1);
      vtx.beginPath();vtx.moveTo(0,0);
      vtx.lineTo(R*Math.cos(-half),R*Math.sin(-half));
      vtx.lineTo(R*Math.cos(half),R*Math.sin(half));
      vtx.closePath();vtx.clip();
      vtx.drawImage(wf,-cx,-cy);
      vtx.restore();
    }
  }
  // seed ripples
  for(var i=ripples.length-1;i>=0;i--){
    var rp=ripples[i],age=(now-rp.t0)/1400;
    if(age>=1){ripples.splice(i,1);continue;}
    vtx.beginPath();
    vtx.arc(rp.x,rp.y,10+age*90,0,6.2832);
    vtx.strokeStyle='rgba(255,255,255,'+(0.5*(1-age)).toFixed(3)+')';
    vtx.lineWidth=2;vtx.stroke();
  }
}
var lastFrame=0;
function loop(now){
  requestAnimationFrame(loop);
  if(now-lastRow>=33){pushRow(now);lastRow=now;
    if(AC&&AC.state==='running'&&noteEl.classList.contains('on')&&noteEl.textContent.indexOf('wake')>=0)noteEl.classList.remove('on');}
  if(now-lastFrame>=16){draw(now);lastFrame=now;}
}

/* ---------- controls ---------- */
function syncButtons(){
  document.querySelectorAll('[data-set]').forEach(function(b){
    var set=b.getAttribute('data-set'),val=b.getAttribute('data-val'),on=false;
    if(set==='src')on=(val===source);
    if(set==='mirror')on=(parseInt(val,10)===mirror);
    if(set==='pal')on=(val===palette);
    if(set==='sound'){b.textContent='Sound: '+(soundOn?'on':'off');on=soundOn;}
    b.classList.toggle('on',!!on);
  });
}
document.querySelectorAll('[data-set]').forEach(function(b){
  b.addEventListener('click',function(){
    var set=b.getAttribute('data-set'),val=b.getAttribute('data-val');
    ensureAudio();if(AC&&AC.resume)AC.resume();
    if(set==='src')setSource(val);
    else if(set==='mirror'){mirror=parseInt(val,10);syncButtons();}
    else if(set==='pal'){palette=val;lut=LUTS[palette];syncButtons();}
    else if(set==='sound'){
      soundOn=!soundOn;
      if(outGain)outGain.gain.setTargetAtTime(soundOn?0.16:0,AC.currentTime,0.1);
      syncButtons();
    }
  });
});
document.getElementById('saveBtn').addEventListener('click',function(){
  var a=document.createElement('a');
  a.download='waterfall-garden.png';
  a.href=view.toDataURL('image/png');
  a.click();
  note('Saved a snapshot of the garden.');
});
view.addEventListener('pointerdown',function(e){
  ensureAudio();if(AC&&AC.resume)AC.resume();
  var r=view.getBoundingClientRect();
  seedTone(e.clientX-r.left,e.clientY-r.top);
});
document.addEventListener('pointerdown',function(){
  if(!AC||AC.state!=='running')note('Tap anywhere to wake the garden.',true);
},{once:true});

resize();syncButtons();
note('Tap anywhere to wake the garden.',true);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
